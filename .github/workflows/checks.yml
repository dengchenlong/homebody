name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          pip install -e ".[dev]"
          # the exploration extra's hardware half (CycloneDDS, unitree SDK) needs a C build;
          # the tests only reach the pure-Python and wheel half of it
          pip install matplotlib opencv-python-headless pyzmq mcap yourdfpy scikit-image
      - name: Install GL libraries
        run: sudo apt-get update && sudo apt-get install -y libosmesa6 libgl1
      - name: Lint
        run: ruff check src tests tools
      - name: Test
        run: pytest tests -q
        env:
          MUJOCO_GL: osmesa
